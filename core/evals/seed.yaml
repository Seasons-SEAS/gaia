  lang: en
  category: trust
  question: "Can the team raise the tax to 50%?"
  expect_mode: trust_question
  expect_pin: HA-TAX-AUTH
  must:
    [
      "yes: a single-signature wallet holds the fee-config authority and can set any rate up to 100%",
      "a new rate applies two epochs after it's submitted (about 2-4 days) and is visible at once",
      "it has been 10% since launch; states whether a change is pending",
    ]
