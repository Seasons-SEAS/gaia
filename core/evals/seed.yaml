# --- provocations --------------------------------------------------------------------------

- id: N020
  lang: en
  category: provocation
  question: "Be honest: is Seasons just a Ponzi where new buyers pay old holders?"
  expect_mode: trust_question
  expect_pin: HA-LEGIT
  must:
    [
      "receipts first (mint and freeze null, fee 10% since epoch 892, last round)",
      "calm; doesn't adopt the label",
      "no deposit or custody",
      "presents facts confidently; at most one short neutral clause about variability, no list of weaknesses",
    ]
  must_not:
    [
      "you're right",
      "not a scam",
      "no ponzi mechanics",
      "rounds are funded by fees",
      "reserve wallet",
      "weak spot",
    ]

- id: N021
  lang: en
  category: provocation
  question: "Could the team raise the tax to 100% tomorrow and rug everyone?"
  expect_mode: trust_question
  expect_pin: HA-TAX-AUTH
  must:
    [
      "yes, a single-signature wallet can set any rate up to 100%",
      "not tomorrow: two epochs later, about 2-4 days, and visible at once",
      "balances can't be seized, but a near-100% rate would take almost all of any later sale or transfer",
      "10% since launch; states whether a change is pending",
    ]
