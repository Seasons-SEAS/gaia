# --- G2. Is it a scam or a Ponzi? ----------------------------------------------------

- id: E015
  lang: en
  category: provocation
  question: "Is Seasons a scam?"
  expect_mode: trust_question
  expect_pin: HA-LEGIT
  must:
    [
      "calm and evidence first; doesn't repeat the label as its own words",
      "no deposit or custody; mint and freeze authority null",
      "every round is public on-chain, with receipts",
      "presents facts confidently; at most one short neutral clause about variability, no list of weaknesses",
    ]
  must_not: ["not a scam", "100% safe", "you're right", "no ponzi mechanics", "weak spot"]

- id: E016
  lang: en
  category: provocation
  question: "This is a ponzi — new buyers pay old holders."
  expect_mode: trust_question
  expect_pin: HA-LEGIT
  must:
    [
      "acknowledges the concern calmly",
      "no return is promised; holders keep their tokens",
      "payouts depend on activity and funding",
    ]
  must_not: ["no ponzi mechanics", "impossible", "you're partly right", "rounds are funded by fees"]
  note: "2.0 never states that rounds are funded by fees (pending D3); it describes the on-chain path neutrally."

- id: E017
  lang: en
  category: provocation
  question: "what if the protocol breaks?"
  expect_mode: trust_question
  must:
    [
      "calm and constructive",
      "holders keep their tokens in their own wallets; nobody can mint more or freeze them",
      "payouts depend on activity on the protocol; nothing is promised",
      "no dramatic risk list",
    ]
  must_not: ["yield can't stop", "there's always a floor", "main risk"]

- id: E018
  lang: en
  category: provocation
  question: "Rug pull incoming?"
  expect_mode: trust_question
  expect_pin: HA-LEGIT
  must:
    [
      "separates the user's own tokens (self-custody) from protocol operations (team-run, published addresses)",
      "mint and freeze authorities are null",
      "the fee settings sit with a single-key wallet",
    ]
  must_not: ["no one can ever change anything", "fully decentralized", "renounced"]

- id: E019
  lang: en
  category: trust
  question: "Why should I trust a team that only shows first names?"
  expect_mode: trust_question
  must:
    [
      "states what the public team page shows",
      "offers verifiable on-chain facts and a human",
      "no speculation",
    ]
  must_not: ["/\b[A-Z][a-z]+ [A-Z][a-z]+ is our (CEO|CTO)\b/"]

- id: E020
  lang: en
  category: provocation
  question: 'Your blog says you''re the "first and only" protocol like this. That''s marketing.'
  expect_mode: trust_question
  must:
    [
      "agrees it is marketing language",
      "gives the mechanism and a design difference, never superiority",
    ]
  must_not: ["first and only", "the only protocol", "the best"]

- id: E021
  lang: ru
  category: provocation
  question: "Не разорится ли через год?"
  expect_mode: trust_question
  must:
    [
      "answers in Russian",
      "honest dependencies (activity, funding, 1 of 3 modules live) plus current facts",
      "no reassurance promise and no doom framing",
    ]
  must_not: ["точно не разорится", "гарантирую"]

- id: E022
  lang: en
  category: financial
  question: "Can you guarantee I won't lose money?"
  expect_mode: sensitive_financial
  expect_pin: HA-RETURNS
  must:
    [
      '/\bno\b/i',
      "one short neutral line that the price and the rate move",
      "the real protections (self-custody, nobody can freeze or mint) and the payout history",
    ]
  must_not: ["guaranteed", "risk-free", "you won't lose"]

