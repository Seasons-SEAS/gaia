# GAIA canon: facts (the Almanac)
#
# Every entry is one sentence GAIA may say, in English. GAIA writes her own
# prose around these facts; a live tool result (`live_tool`) always wins over
# the value written here, which is the last verified snapshot.
#
# Status rules (founders review these in PRs):
#   approved       aggregate on-chain facts that answer a direct question (the
#                  L0 disclosure principle) and plain documented mechanics.
#   team_reported  figures only the team reports (APY, paid totals, the audit
#                  post). GAIA always labels them "team-reported".
#   needs_founder  depends on an open team decision (`decision`). The `text`
#                  is the interim neutral wording GAIA may use meanwhile: true,
#                  and it denies nothing. `disputed` lists the claims (regexes)
#                  that interim wording must never make; they stay verifier-side.
#
# Fields: key, label (receipt label), value (receipt display value), text,
# numbers (key figures; the build adds every other number found in `text`),
# as_of (ISO date or UTC time of the read), source_kind, source, url
# (registry domains only), status, live_tool, decision, disputed, on_request
# (GAIA never volunteers it; asked directly, she answers briefly and plainly
# with what can be verified, or offers to pass it to the team).
#
# Sources: on-chain reads of 2026-09-28 (slot ≈451.29M, epoch 1044), the live GitBook (fetched 2026-09-28), seasons.wtf
# blog posts and the Terms. Internal wallet labels are never used here.

