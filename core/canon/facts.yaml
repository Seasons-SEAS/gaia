- key: tax.round_trip
  label: Round-trip cost of the 10% fee
  value: keeps ≈81%; ≈19% cost; break-even ≈+23.46%
  text: >-
    With 10% in and 10% out, buying and later selling at the same price keeps about 81% of the value, a
    round-trip cost of about 19% before pool fees, and the price would have to rise about 23.46% just to
    break even.
  numbers: [10, 81, 0.81, 19, 0.19, 23.46, 0.2346]
  as_of: 2026-09-28
  source_kind: calc
  source: "0.9 × 0.9 = 0.81; 1 / 0.81 − 1 = 0.2346"
  url: https://seasons.gitbook.io/seasons-docs/protocol/yield-3.0-mechanism/generation/ttt
  status: approved
  on_request: true

- key: tax.gross_up
  label: Gross amount needed to net a balance
  value: net ÷ 0.9 (10,000 → 11,111.12)
  text: >-
    Ending up with a net balance takes about 1.111× it before the fee, whether bought or sent from
    another wallet: netting 10,000 $SEAS takes about 11,111.12 and netting 1,000 about 1,111.12, while
    sending exactly 10,000 delivers 9,000, a Builder balance.
  numbers: [1.111, 10000, 11111.12, 1000, 1111.12, 9000]
  as_of: 2026-09-28
  source_kind: calc
  source: "gross = net / (1 − 0.10)"
  url: https://seasons.gitbook.io/seasons-docs/protocol/yield-3.0-mechanism/generation/ttt
  status: approved

- key: tax.earn_back_formula
  label: Time to earn back the fee (formula)
  value: entry fee ≈ 0.11 ÷ r years; round trip ≈ 0.21 ÷ r years
  text: >-
    At a steady price and a rate r that the user chooses, earning back the entry fee takes about 0.11 ÷ r
    years and recovering a full round trip about 0.21 ÷ r years, and any real price move changes the
    result.
  numbers: [0.11, 0.21, 0.2111]
  as_of: 2026-09-28
  source_kind: calc
  source: "t / ((1 − t)·r) and (1 − (1 − t)²) / ((1 − t)·r) with t = 0.10"
  status: approved

