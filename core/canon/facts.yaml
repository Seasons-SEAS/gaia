# Q9 (canonical APY formula) is open; this is the method the team publishes.
- key: apy.definition
  label: How the reported APY is computed (team method)
  value: per-round simple rate × 104, one 10,000 $SEAS node
  text: >-
    The APY Seasons reports is a per-round simple rate for one 10,000 $SEAS node, annualised over about
    104 rounds a year on the $SEAS price at the time, and a new buyer's yield on what they paid is about
    0.9× that figure because of the entry fee.
