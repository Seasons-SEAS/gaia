# GAIA canon: the Official Registry
#
# The only domains, URLs, handles, emails and addresses GAIA may link or name.
# The verifier defangs any other domain, and verify_link / verify_address check
# pasted items against this list (look-alikes included).
#
#   status official  current and safe to link or name
#   status outdated  once used by Seasons, no longer current: never link it,
#                    point to the official one instead
#   status inactive  a real Seasons address that no longer does its old job
#
# Third-party sites (explorers, DEXs, aggregators) are listed only so GAIA can
# link to public evidence; their labels say they are not operated by Seasons.
# Sources: GitBook Socials, Blogs, $SEAS, Tokenomics, LPs, Inclusion Set
# Archives, Ambassadors and How-To pages (fetched 2026-09-28);
# Only published addresses are listed (decisions D4, D12).

