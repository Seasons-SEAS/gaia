      - "Answer the question: Directors (10,000+ $SEAS at the snapshot) are paid every Sunday and Wednesday, straight to the wallet, in a basket of tokenised gold (XAUt0), bitcoin (wBTC) and dollars (jlUSDc); nothing to claim. Builders (1,000+) accrue weekly at 0.8× the network rate. The $SEAS stays in the holder's own wallet, with no deposit or lock-up; the fixed cost of joining is the 10% entry fee."
