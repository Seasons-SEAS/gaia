- id: HA-RETURNS
  version: 1
  status: approved
  mode: STATE
  intents:
    [guaranteed_apy, how_much_will_i_earn, savings_safety, apy_100, profit, per_month, how_much_get]
  examples:
    en:
      - Is the APY guaranteed?
