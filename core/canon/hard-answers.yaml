# GAIA canon: Hard Answers registry
#
# The answers that are verifiable, uncomfortable and brand-critical. GAIA writes
# every answer in her own words around these anchors: the facts are fixed, the
# prose is alive.
#
# Two halves per entry, so nothing can be extracted:
#   model_brief  the ONLY part that reaches the model (per-turn system message).
#                Public facts only; the strongest verifiable
#                facts first, never the hostile frame, nothing false.
#                counterweight: said only if the user asks about the downside.
#   verifier     output-side checks only; never placed in any prompt.
#                must_not: claim-scoped phrases per language (case-insensitive).
#                forbidden_implicatures: claims the semantic judge blocks.
#                cooccurrence_block: a concession phrase next to a hostile label.
#
# Modes: STATE (approved facts, plainly) or HOLD (say everything verifiable, say
# what isn't known, log the question). There is no DENY mode.
#
# `meta` is registry bookkeeping (open decisions, review, queue,
# review date). It is compiled beside the entry, never into a prompt.
# Decision IDs: D1-D12 and D-VOL name open team decisions.

- id: HA-LEGIT
  version: 1
  status: approved
  mode: STATE
  intents: [scam, ponzi, pyramid, is_it_legit, rug_pull_generic]
  examples:
    en:
      - Is Seasons a scam?
      - Is this a Ponzi?
      - New buyers pay old holders, right?
      - Is Seasons legit?
      - This looks like a pyramid scheme
      - Is this a rug pull?
    ru:
      - Это пирамида?
      - Seasons — это скам?
      - Это финансовая пирамида или нет?
      - Это лохотрон?
      - Новые покупатели платят старым?
    de:
      - Ist Seasons ein Schneeballsystem?
      - Ist das Betrug?
      - Ist Seasons seriös?
      - Ist das ein Ponzi-System?
    es:
      - ¿Es una estafa?
      - ¿Seasons es un esquema Ponzi?
      - ¿Es una pirámide?
      - ¿Seasons es legítimo?
    ja:
      - これは詐欺ですか？
      - Seasonsはポンジスキームですか？
      - ねずみ講じゃないの？
      - Seasonsは信頼できますか？
  required_fact_keys:
    - token.mint_authority
    - token.freeze_authority
    - custody.self
    - distribution.last_round
    - distribution.weekday_streak
    - apy.not_guaranteed
    - tax.round_trip
    - fee.config_authority
    - funding.observed_path
    - fees.last_collected
    - funding.reconciliation
    - modules.status
  model_brief:
    core_points:
      - "Answer with evidence, calmly and confidently, and never repeat the hostile label as your own words."
      - "No deposit and no custody: $SEAS stays in the holder's own wallet, with no staking contract or lock-up; mint and freeze authority are both null, so nobody, the team included, can create more $SEAS or freeze a holder's balance."
      - "Every round is public on-chain: give the last round and the Sunday/Wednesday streak from this turn's receipts and offer to trace it together."
      - "Payouts go straight to node wallets in a basket of tokenised gold, bitcoin and dollars, with nothing to claim; nothing is promised, and the rate each round depends on activity."
      - "The design favours holding: the 10% fee is fixed in the token and makes quick flipping costly."
      - "Next step: offer to show the last round on-chain or to read the mint live."
    short_form: "Fair question, and the chain answers it. No deposit, your $SEAS stays in your wallet, nobody can mint more or freeze it, and every payout round is public on-chain, on schedule."
    counterweight: "Payouts vary from round to round, and nothing about them is guaranteed."
  verifier:
    must_not:
      en:
        [
          "not a scam",
          "100% safe",
          "completely safe",
          "no ponzi mechanics",
          "fees go straight to holders",
          "fees go directly to holders",
          "seasons holds no assets",
          "seasons doesn't hold any assets",
          "nothing leaves your wallet without your signature",
          "guaranteed return",
          "guaranteed yield",
          "risk-free",
          "rounds are funded by fees",
          "funded by trading fees",
          "last 48 hours of fees",
        ]
      ru:
        [
          "не скам",
          "не пирамида",
          "100% безопасно",
          "гарантированный доход",
          "без риска",
          "ничего не уходит из кошелька без вашей подписи",
        ]
      de:
        ["kein Betrug", "kein Schneeballsystem", "100% sicher", "garantierte Rendite", "risikofrei"]
      es: ["no es una estafa", "100% seguro", "rentabilidad garantizada", "sin riesgo"]
      ja: ["詐欺ではありません", "100%安全", "保証された利回り", "リスクはありません"]
    forbidden_implicatures:
      - "today's rounds are funded by collected fees"
      - "on-time payouts prove trading demand"
      - "self-custody removes all risk"
      - "Seasons holds no assets or keys"
    cooccurrence_block:
      concede:
        en: ["you're right", "you are right", "you're partly right", "you have a point"]
        ru: ["Вы правы", "вы правы", "отчасти правы", "в чём-то правы"]
        de: ["Sie haben recht", "teilweise recht", "da haben Sie recht"]
        es: ["tiene razón", "tiene parte de razón", "en parte tiene razón"]
        ja: ["おっしゃる通り", "一理あります", "その通りです"]
      label:
        en: ["ponzi", "scam", "pyramid"]
        ru: ["пирамид", "скам", "мошенн", "лохотрон"]
        de: ["Schneeball", "Betrug", "Ponzi"]
        es: ["ponzi", "estafa", "pirámide"]
        ja: ["ポンジ", "詐欺", "ねずみ講"]
  meta:
    requires_review: true
    decisions: [D3, D12]
    queue: false
    review_by: 2026-12-31

